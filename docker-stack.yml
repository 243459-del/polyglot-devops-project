version: '3.8'

networks:
  swarm-net:
    driver: overlay

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - swarm-net

  backend:
    image: backend-test:latest
    ports:
      - "5000:5000"
    networks:
      - swarm-net

  worker:
    image: worker-test:latest
    networks:
      - swarm-net

  frontend:
    image: frontend-test:latest
    ports:
      - "8080:80"
    networks:
      - swarm-net