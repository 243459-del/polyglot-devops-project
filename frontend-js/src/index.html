<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Cloud Migration</title>
    <style>
        /* DEMO NOTE: Final demo me aap is background color ya text ko change karenge */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #4A90E2; /* Blue Color */
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            background: rgba(0, 0, 0, 0.2);
            padding: 40px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 50px;
        }
        h1 { margin-bottom: 10px; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
        .version { font-weight: bold; background: #ff9800; padding: 5px 10px; border-radius: 5px; display: inline-block; margin-top: 10px; }
        .status-box { margin-top: 30px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Polyglot Application</h1>
        <div class="version">Version 1.0 (Initial Deployment)</div>
        <p>Air University - ADCS-IV DevOps Semester Project</p>
        
        <div class="status-box">
            <h3>System Status:</h3>
            <p id="backend-status">Connecting to ASP.NET Core API...</p>
        </div>
    </div>

    <script>
        // Baad mein jab backend chalega to hum isko real API URL se connect karenge
        setTimeout(() => {
            document.getElementById('backend-status').innerText = "Backend API Connected (Simulated)";
        }, 2000);
    </script>
</body>
</html>
