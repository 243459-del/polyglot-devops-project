<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTask // Advanced Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: linear-gradient(90deg, #6366f1, #a855f7);
            --accent-glow: 0 0 20px rgba(168, 85, 247, 0.4);
            --card-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- GLOWING BACKGROUND ORBS --- */
        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.3;
        }
        .orb-1 { top: -100px; left: -100px; background: #4f46e5; }
        .orb-2 { bottom: -100px; right: -100px; background: #7c3aed; }

        /* --- GLASSMORPHISM NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links .active {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .nav-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--accent-glow);
        }

        /* --- HERO & CONTENT SPACE --- */
        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 4%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-section h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* --- INPUT GLASS FORM --- */
        .task-input-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: var(--card-radius);
            max-width: 700px;
            margin: 0 auto 50px auto;
            display: flex;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .task-input-container input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 14px 20px;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .task-input-container input:focus {
            border-color: #a855f7;
        }

        /* --- THE PREMIUM CARDS GRID --- */
        .grid-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #c084fc;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .task-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: var(--card-radius);
            padding: 25px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-card:hover {
            transform: translateY(-5px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(99, 102, 241, 0.1);
        }

        .card-badge {
            align-self: flex-start;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .badge-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-low { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .card-text {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }

        .card-date {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }

        .btn-complete:hover { color: #34d399; }
        .btn-delete:hover { color: #f87171; }

        @media (max-width: 768px) {
            .navbar { padding: 15px 4%; }
            .header-section h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <i class="fa-solid fa-cubes"></i> ProTask.io
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Dashboard</a></li>
        </ul>
        <button class="nav-btn"><i class="fa-solid fa-plus"></i> New Space</button>
    </nav>

    <div class="container">
        
        <div class="header-section">
            <h1>Welcome to Your Smart Workspace</h1>
            <p>Polyglot Engine Connected & Live on Azure VM Instance</p>
        </div>

        <div class="task-input-container">
            <input type="text" id="task-input" placeholder="Type a new high-priority milestone task here...">
            <button class="nav-btn" id="add-task-btn" style="border-radius: 10px; padding: 0 25px;">Add Task</button>
        </div>

        <div class="grid-title">
            <i class="fa-solid fa-layer-group"></i> Active Deployment Tasks
        </div>

        <div class="cards-grid" id="cards-container">
            
            <div class="task-card">
                <div class="card-badge badge-high">High Priority</div>
                <div class="card-text">Setup continuous deployment pipeline trigger using GitHub Actions workflow orchestration.</div>
                <div class="card-footer">
                    <div class="card-date"><i class="fa-regular fa-calendar"></i> June 04, 2026</div>
                    <div class="card-actions">
                        <button class="action-btn btn-complete" onclick="toggleComplete(this)"><i class="fa-regular fa-circle-check"></i></button>
                        <button class="action-btn btn-delete" onclick="deleteCard(this)"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        const taskInput = document.getElementById('task-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const cardsContainer = document.getElementById('cards-container');

        // Task add karne ka function
        function createNewTask() {
            const taskText = taskInput.value.trim();
            
            if (taskText === "") {
                alert("Please type a task first!");
                return;
            }

            // Current date nikalne ke liye
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            const today = new Date().toLocaleDateString('en-US', options);

            // Naya Card dynamic HTML string
            const cardHTML = `
                <div class="task-card">
                    <div class="card-badge badge-medium">Active Task</div>
                    <div class="card-text">${taskText}</div>
                    <div class="card-footer">
                        <div class="card-date"><i class="fa-regular fa-calendar"></i> ${today}</div>
                        <div class="card-actions">
                            <button class="action-btn btn-complete" onclick="toggleComplete(this)"><i class="fa-regular fa-circle-check"></i></button>
                            <button class="action-btn btn-delete" onclick="deleteCard(this)"><i class="fa-regular fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>
            `;

            // Grid ke andar side par card append (add) karna
            cardsContainer.insertAdjacentHTML('beforeend', cardHTML);
            
            // Input field ko clear karna
            taskInput.value = "";
        }

        // Button click event listener
        addTaskBtn.addEventListener('click', createNewTask);

        // Enter key press event listener
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                createNewTask();
            }
        });

        // Card complete (Green checkmark toggle) karne ka logic
        function toggleComplete(button) {
            const icon = button.querySelector('i');
            const cardText = button.closest('.task-card').querySelector('.card-text');
            
            if (icon.classList.contains('fa-regular')) {
                icon.className = 'fa-solid fa-circle-check';
                button.style.color = '#34d399';
                cardText.style.textDecoration = 'line-through';
                cardText.style.opacity = '0.5';
            } else {
                icon.className = 'fa-regular fa-circle-check';
                button.style.color = 'var(--text-muted)';
                cardText.style.textDecoration = 'none';
                cardText.style.opacity = '1';
            }
        }

        // Card delete karne ka logic
        function deleteCard(button) {
            const card = button.closest('.task-card');
            card.style.opacity = '0';
            card.style.transform = 'scale(0.9)';
            setTimeout(() => {
                card.remove();
            }, 300);
        }
    </script>

</body>
</html>
